# Verificación continua. Sin dependencias externas: el puente no usa npm.
#
# Node 22.15 es el mínimo real del proyecto: los avisos por turno leen frames
# zstd con `node:zlib`, que no existe en versiones anteriores.
#
# Dos trabajos:
#   1. audit: sintaxis de todos los .mjs, auditoría del árbol y guardas de
#      configuración (no necesitan puente).
#   2. suite: arranca un puente aislado con HOME/DSH_HOME temporales, puertos
#      libres de loopback y un backend DeepSeek Harness mínimo de pruebas.
#      Ejecuta las suites que no exigen un DSH real; las que sí lo exigen (o son
#      destructivas) se omiten con motivo explícito en test/README.md.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Auditoría del árbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sintaxis de todos los módulos
        run: |
          fail=0
          for f in $(git ls-files '*.mjs'); do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Auditoría del repositorio
        run: node tools/audit-repo.mjs

      - name: Guardas de configuración (sin puente)
        run: node test/verify_config_guard.mjs

      # Si cambia el texto de un FAIL/AVISO en doctor.ps1, este check falla y
      # obliga a actualizar doctor-fixes.json (la skill depende de ese mapa).
      - name: Mapa de soluciones al día (doctor-fixes.json)
        run: node skills/mobile-companion-setup/scripts/verify-fixes.mjs static

  suite:
    name: Suite del puente (aislada)
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No hay `npm install`: el proyecto no tiene dependencias.
      - name: Pruebas del puente sin DeepSeek Harness real
        run: npm run test:ci
