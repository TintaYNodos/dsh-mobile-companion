# Verificación continua. Sin dependencias externas: el puente no usa npm.
#
# Node 22.15 es el mínimo real del proyecto: los avisos por turno leen frames
# zstd con `node:zlib`, que no existe en versiones anteriores. Las pruebas que
# necesitan un puente vivo no corren aquí; su límite está documentado en
# test/README.md.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Auditoría del árbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sintaxis de todos los módulos
        run: |
          fail=0
          for f in $(git ls-files '*.mjs'); do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Auditoría del repositorio
        run: node tools/audit-repo.mjs

      - name: Guardas de configuración (sin puente)
        run: node test/verify_config_guard.mjs
