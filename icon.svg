<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#11131c"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1e2433" stroke-width="3"/>
  
  <!-- Cyberpunk Nodes / Shield -->
  <g filter="url(#glow)" transform="translate(4, 0)">
    <!-- Circuit lines -->
    <path d="M 120 180 L 190 180 L 256 120 L 322 180 L 392 180" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="6,6"/>
    <path d="M 120 332 L 190 332 L 256 392 L 322 332 L 392 332" fill="none" stroke="#ff007a" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="6,6"/>
    <path d="M 120 180 L 120 332" fill="none" stroke="#7000ff" stroke-width="4" stroke-opacity="0.4"/>
    <path d="M 392 180 L 392 332" fill="none" stroke="#7000ff" stroke-width="4" stroke-opacity="0.4"/>

    <!-- Central Emblem: Stylized DSH / Mobile Node -->
    <polygon points="256,140 370,206 370,338 256,404 142,338 142,206" fill="#121522" stroke="url(#accent)" stroke-width="10"/>
    
    <!-- Inner Core -->
    <circle cx="256" cy="256" r="32" fill="url(#accent)"/>
    
    <!-- Connection beams -->
    <line x1="256" y1="140" x2="256" y2="224" stroke="#00f0ff" stroke-width="6"/>
    <line x1="256" y1="288" x2="256" y2="404" stroke="#ff007a" stroke-width="6"/>
    <line x1="142" y1="206" x2="228" y2="242" stroke="#00f0ff" stroke-width="6"/>
    <line x1="370" y1="206" x2="284" y2="242" stroke="#00f0ff" stroke-width="6"/>
    <line x1="142" y1="338" x2="228" y2="270" stroke="#ff007a" stroke-width="6"/>
    <line x1="370" y1="338" x2="284" y2="270" stroke="#ff007a" stroke-width="6"/>
  </g>
</svg>
