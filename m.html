<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DSH Mobile Companion</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    :root {
      --bg-base: #07080c;
      --bg-surface: #0f121a;
      --bg-card: #141824;
      --border-color: #1e2538;
      --border-focus: #00f0ff;
      --text-main: #f1f5f9;
      --text-muted: #8b9bb4;
      --accent-cyan: #00f0ff;
      --accent-purple: #a855f7;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "Fira Code", Menlo, Monaco, Consolas, "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-stack);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.04) 0%, transparent 40%);
    }

    /* Top Bar */
    header {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 14, 22, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
      padding-top: env(safe-area-inset-top, 0px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #00f0ff 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      transition: all 0.25s ease;
      user-select: none;
    }

    .status-pill.offline {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--accent-amber);
    }

    .status-pill.online {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--accent-green);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .status-pill.offline .status-dot {
      background-color: var(--accent-amber);
    }

    .status-pill.online .status-dot {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse-dot 1.8s infinite;
    }

    @keyframes pulse-dot {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    /* Header Icon Buttons */
    .btn-icon {
      background: rgba(20, 24, 36, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-icon:hover, .btn-icon:active {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
    }

    /* Sync Banner */
    #syncBanner {
      display: none;
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.14), rgba(0, 240, 255, 0.14));
      border-bottom: 1px solid rgba(16, 185, 129, 0.35);
      padding: 10px 14px;
      font-size: 0.82rem;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 15;
    }

    .sync-info {
      color: #d1fae5;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync-banner-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-sync-action {
      background: linear-gradient(135deg, #00f0ff, #10b981);
      color: #051412;
      border: none;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.35);
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .btn-sync-action:hover, .btn-sync-action:active {
      opacity: 0.9;
    }

    .btn-dsh-link {
      background: rgba(168, 85, 247, 0.18);
      color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.76rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    /* Chat Messages Container */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }

    /* Welcome Hero */
    .hero-box {
      margin: auto;
      max-width: 440px;
      text-align: center;
      padding: 24px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .hero-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .hero-p {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .hero-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      margin-bottom: 18px;
    }

    .hero-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(20, 24, 36, 0.5);
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 2px solid var(--accent-cyan);
    }

    .hero-step-num {
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .btn-hero-config {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(168, 85, 247, 0.2));
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #fff;
      font-weight: 600;
      font-size: 0.84rem;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 90%;
      word-break: break-word;
    }

    .msg-row.user {
      align-self: flex-end;
    }

    .msg-row.assistant {
      align-self: flex-start;
      max-width: 95%;
    }

    .msg-bubble {
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .msg-row.user .msg-bubble {
      background: #151b29;
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-right: 3px solid var(--accent-cyan);
      color: #f8fafc;
      border-bottom-right-radius: 3px;
    }

    .msg-row.assistant .msg-bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-purple);
      color: #e2e8f0;
      border-bottom-left-radius: 3px;
    }

    .msg-time {
      font-size: 0.68rem;
      color: #64748b;
      margin-left: 4px;
      margin-right: 4px;
    }

    .msg-row.user .msg-time {
      text-align: right;
    }

    /* Markdown Formatted Elements */
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
      color: #fff;
      margin: 10px 0 6px 0;
      font-size: 1.05rem;
    }
    .msg-bubble h1:first-child, .msg-bubble h2:first-child, .msg-bubble h3:first-child {
      margin-top: 0;
    }
    .msg-bubble p {
      margin-bottom: 8px;
    }
    .msg-bubble p:last-child {
      margin-bottom: 0;
    }
    .msg-bubble ul, .msg-bubble ol {
      padding-left: 20px;
      margin-bottom: 8px;
    }
    .msg-bubble li {
      margin-bottom: 4px;
    }
    .msg-bubble a {
      color: var(--accent-cyan);
      text-decoration: underline;
    }
    .msg-bubble blockquote {
      border-left: 3px solid var(--border-color);
      padding-left: 10px;
      margin: 8px 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .code-block {
      background: #090b10;
      border: 1px solid #1a2234;
      border-radius: 8px;
      margin: 8px 0;
      overflow: hidden;
    }

    .code-header {
      background: #0f131d;
      padding: 4px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: #94a3b8;
      border-bottom: 1px solid #1a2234;
    }

    .btn-copy-code {
      background: transparent;
      border: 1px solid #28334a;
      color: #94a3b8;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.68rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-copy-code:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    .code-block code {
      display: block;
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.4;
      overflow-x: auto;
      color: #e2e8f0;
      white-space: pre;
    }

    .inline-code {
      font-family: var(--font-mono);
      background: rgba(0, 240, 255, 0.08);
      color: #38bdf8;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.82rem;
    }

    /* Live Cursor */
    .stream-cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: var(--accent-cyan);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Bottom Input Bar */
    footer {
      padding: 8px 12px;
      background: rgba(11, 14, 22, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
    }

    .input-wrapper {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
    }

    #userInput {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-stack);
      font-size: 0.92rem;
      resize: none;
      max-height: 120px;
      min-height: 22px;
      line-height: 1.4;
    }

    #userInput::placeholder {
      color: #64748b;
    }

    .btn-send {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f0ff, #7928ca);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, opacity 0.2s;
    }

    .btn-send:active {
      transform: scale(0.92);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-stop {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Modal / Settings Drawer */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: #0f121a;
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px 18px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      animation: slide-up 0.22s ease-out;
    }

    @keyframes slide-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .provider-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .provider-tab-btn {
      background: #141824;
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      padding: 9px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .provider-tab-btn.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: #141824;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: var(--font-stack);
      font-size: 0.88rem;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-cyan);
    }

    .input-password-row {
      position: relative;
      display: flex;
      align-items: center;
    }

    .btn-toggle-eye {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }

    .form-hint {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 4px;
      line-height: 1.35;
    }

    .form-hint a {
      color: var(--accent-cyan);
      text-decoration: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #00f0ff, #7928ca);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary {
      background: #1e2434;
      color: #cbd5e1;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #141824;
      border: 1px solid var(--accent-cyan);
      color: #fff;
      padding: 9px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 99;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 512 512">
        <polygon points="256,140 370,206 370,338 256,404 142,338 142,206" fill="#121522" stroke="#00f0ff" stroke-width="24"/>
        <circle cx="256" cy="256" r="48" fill="#00f0ff"/>
      </svg>
      <span class="brand-title">DSH Companion</span>
    </div>

    <div class="header-actions">
      <!-- Status pill -->
      <div id="statusPill" class="status-pill offline" title="Estado de conexión con la PC búnker">
        <span class="status-dot"></span>
        <span id="statusLabel">Satélite</span>
      </div>

      <!-- Sync Button -->
      <button id="btnHeaderSync" class="btn-icon" title="Sincronizar chat con el Búnker">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>

      <!-- Web GUI direct link -->
      <a id="btnHeaderDsh" class="btn-icon" href="/" title="Abrir Web GUI de DeepSeek Harness" style="display:none; text-decoration:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </a>

      <!-- Config button -->
      <button id="btnOpenConfig" class="btn-icon" title="Configurar API Key">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <!-- Clear Chat button -->
      <button id="btnClearChat" class="btn-icon" title="Limpiar conversación actual">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Sync Banner (when PC is detected and there are messages) -->
  <div id="syncBanner">
    <div class="sync-info">
      <span>⚡ Búnker conectado.</span>
      <span id="unsyncedCountLabel"></span>
    </div>
    <div class="sync-banner-actions">
      <button id="btnBannerSync" class="btn-sync-action">Sincronizar</button>
      <a id="btnBannerDsh" href="/" class="btn-dsh-link">Ir a DSH</a>
    </div>
  </div>

  <!-- Messages scroll area -->
  <div id="chatContainer">
    <!-- Rendered dynamically -->
  </div>

  <!-- Input Area -->
  <footer>
    <div class="input-wrapper">
      <textarea id="userInput" rows="1" placeholder="Escribe un mensaje en modo satélite..."></textarea>
    </div>
    <button id="btnSend" class="btn-send" title="Enviar mensaje">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
    <button id="btnStop" class="btn-stop" title="Detener generación">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
      </svg>
    </button>
  </footer>

  <!-- Modal Settings -->
  <div id="modalSettings" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Configuración Satélite</h3>
        <button id="btnCloseConfig" class="btn-icon">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">Proveedor de IA Móvil</label>
        <div class="provider-tabs">
          <button type="button" class="provider-tab-btn active" data-provider="gemini">Google Gemini</button>
          <button type="button" class="provider-tab-btn" data-provider="deepseek">DeepSeek</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Modelo</label>
        <select id="cfgModel" class="form-select"></select>
      </div>

      <div class="form-group">
        <label class="form-label">API Key</label>
        <div class="input-password-row">
          <input type="password" id="cfgApiKey" class="form-input" placeholder="Pega tu API Key aquí" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button type="button" id="btnToggleApiKeyEye" class="btn-toggle-eye">👁</button>
        </div>
        <p class="form-hint" id="apiKeyHint">
          Obtén tu clave gratuita en <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>.
        </p>
      </div>

      <div class="form-group">
        <label class="form-label">Instrucción de Sistema (Opcional)</label>
        <textarea id="cfgSystemPrompt" class="form-textarea" rows="2" placeholder="Ej: Eres un asistente técnico conciso y directo para Tinta y Nodos."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Host del Búnker (Opcional)</label>
        <input type="text" id="cfgBunkerHost" class="form-input" placeholder="http://10.x.x.x:57420 (dejar vacío para automático)">
        <p class="form-hint">Si usas esta app dentro de un APK o archivo local, ingresa la IP ZeroTier/Tailscale de tu PC.</p>
      </div>

      <div class="modal-actions">
        <button id="btnSaveConfig" class="btn-primary">Guardar Configuración</button>
        <button id="btnCancelConfig" class="btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch((err) => console.log('[SW Error]', err));
    }

    // State
    const STATE = {
      provider: 'gemini', // 'gemini' | 'deepseek'
      apiKey: '',
      model: 'gemini-2.5-flash',
      systemPrompt: 'Eres un asistente técnico ágil, conciso y de alta precisión. Responde directo al grano sin introducciones de cortesía ni despedidas innecesarias.',
      bunkerHost: '',
      messages: [],
      lastSyncedIndex: -1,
      isBunkerOnline: false,
      isStreaming: false,
      abortController: null
    };

    const MODELS = {
      gemini: [
        { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash (Rápido y Gratis)' },
        { id: 'gemini-2.5-pro', name: 'Gemini 2.5 Pro (Razonamiento Avanzado)' }
      ],
      deepseek: [
        { id: 'deepseek-chat', name: 'DeepSeek Chat (V3 / Rápido)' },
        { id: 'deepseek-reasoner', name: 'DeepSeek Reasoner (R1)' }
      ]
    };

    // DOM Elements
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const btnSend = document.getElementById('btnSend');
    const btnStop = document.getElementById('btnStop');
    const statusPill = document.getElementById('statusPill');
    const statusLabel = document.getElementById('statusLabel');
    const btnHeaderSync = document.getElementById('btnHeaderSync');
    const btnHeaderDsh = document.getElementById('btnHeaderDsh');
    const syncBanner = document.getElementById('syncBanner');
    const unsyncedCountLabel = document.getElementById('unsyncedCountLabel');
    const btnBannerSync = document.getElementById('btnBannerSync');
    const btnClearChat = document.getElementById('btnClearChat');
    const modalSettings = document.getElementById('modalSettings');
    const btnOpenConfig = document.getElementById('btnOpenConfig');
    const btnCloseConfig = document.getElementById('btnCloseConfig');
    const btnCancelConfig = document.getElementById('btnCancelConfig');
    const btnSaveConfig = document.getElementById('btnSaveConfig');
    const cfgApiKey = document.getElementById('cfgApiKey');
    const cfgModel = document.getElementById('cfgModel');
    const cfgSystemPrompt = document.getElementById('cfgSystemPrompt');
    const cfgBunkerHost = document.getElementById('cfgBunkerHost');
    const apiKeyHint = document.getElementById('apiKeyHint');
    const btnToggleApiKeyEye = document.getElementById('btnToggleApiKeyEye');
    const toast = document.getElementById('toast');

    // Utility: Show Toast
    function showToast(text, duration = 3000) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    // Load Settings & Chat History
    function loadSavedState() {
      try {
        const savedSettings = JSON.parse(localStorage.getItem('dsh_companion_settings') || '{}');
        if (savedSettings.provider) STATE.provider = savedSettings.provider;
        if (savedSettings.apiKey) STATE.apiKey = savedSettings.apiKey;
        if (savedSettings.model) STATE.model = savedSettings.model;
        if (savedSettings.systemPrompt !== undefined) STATE.systemPrompt = savedSettings.systemPrompt;
        if (savedSettings.bunkerHost !== undefined) STATE.bunkerHost = savedSettings.bunkerHost;

        const savedHistory = JSON.parse(localStorage.getItem('dsh_companion_history') || '[]');
        if (Array.isArray(savedHistory)) STATE.messages = savedHistory;

        STATE.lastSyncedIndex = parseInt(localStorage.getItem('dsh_last_synced_idx') || '-1', 10);
      } catch (e) {
        console.error('Error loading localStorage state', e);
      }
    }

    function saveState() {
      localStorage.setItem('dsh_companion_settings', JSON.stringify({
        provider: STATE.provider,
        apiKey: STATE.apiKey,
        model: STATE.model,
        systemPrompt: STATE.systemPrompt,
        bunkerHost: STATE.bunkerHost
      }));
      localStorage.setItem('dsh_companion_history', JSON.stringify(STATE.messages));
      localStorage.setItem('dsh_last_synced_idx', STATE.lastSyncedIndex.toString());
    }

    // Bunker Target URL
    function getBunkerBaseUrl() {
      if (STATE.bunkerHost && STATE.bunkerHost.trim()) {
        return STATE.bunkerHost.trim().replace(/\/+$/, '');
      }
      if (window.location.origin && window.location.origin.startsWith('http')) {
        return window.location.origin;
      }
      return '';
    }

    // Escape HTML & Basic Markdown Parser
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderMarkdown(md) {
      if (!md) return '';
      let text = escapeHtml(md);

      // Code blocks: ```lang\ncode\n```
      text = text.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
        const langLabel = lang || 'code';
        return `<div class="code-block">
          <div class="code-header">
            <span>${langLabel}</span>
            <button class="btn-copy-code" onclick="copyCode(this)">Copiar</button>
          </div>
          <code>${code.trim()}</code>
        </div>`;
      });

      // Inline code `code`
      text = text.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');

      // Headings
      text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');

      // Bold & Italic
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');

      // Blockquote
      text = text.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');

      // Unordered lists
      text = text.replace(/^\s*[-*]\s+(.*$)/gim, '<li>$1</li>');
      text = text.replace(/(<li>.*<\/li>)/gims, '<ul>$1</ul>');

      // Links [text](url)
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      // Paragraphs & newlines
      const paragraphs = text.split(/\n\s*\n/);
      return paragraphs.map(p => {
        if (/^<(div|ul|ol|h1|h2|h3|blockquote)/.test(p.trim())) {
          return p;
        }
        return `<p>${p.replace(/\n/g, '<br>')}</p>`;
      }).join('');
    }

    window.copyCode = function(btn) {
      const code = btn.closest('.code-block').querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        const prev = btn.innerText;
        btn.innerText = '¡Copiado!';
        setTimeout(() => btn.innerText = prev, 1800);
      });
    };

    // Render Chat
    function renderChat() {
      if (STATE.messages.length === 0) {
        chatContainer.innerHTML = `
          <div class="hero-box">
            <h2 class="hero-title">Modo Satélite Autónomo</h2>
            <p class="hero-p">Chatea directamente en la calle usando tu propia API Key. Al conectar con la PC por VPN, sincroniza el chat con el Búnker en un clic.</p>
            <div class="hero-steps">
              <div class="hero-step">
                <span class="hero-step-num">1</span>
                <span>Configura tu API Key (Gemini o DeepSeek).</span>
              </div>
              <div class="hero-step">
                <span class="hero-step-num">2</span>
                <span>Chatea en cualquier lugar con streaming directo.</span>
              </div>
              <div class="hero-step">
                <span class="hero-step-num">3</span>
                <span>Al detectar tu PC encendida, pulsa Sincronizar.</span>
              </div>
            </div>
            ${!STATE.apiKey ? '<button class="btn-hero-config" onclick="openSettingsModal()">⚙️ Configurar API Key Ahora</button>' : ''}
          </div>
        `;
        updateSyncBanner();
        return;
      }

      let html = '';
      STATE.messages.forEach((msg, idx) => {
        const isUser = msg.role === 'user';
        const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const contentHtml = isUser ? escapeHtml(msg.content).replace(/\n/g, '<br>') : renderMarkdown(msg.content);

        html += `
          <div class="msg-row ${isUser ? 'user' : 'assistant'}" data-index="${idx}">
            <div class="msg-bubble">${contentHtml}</div>
            <div class="msg-time">${timeStr}</div>
          </div>
        `;
      });

      chatContainer.innerHTML = html;
      chatContainer.scrollTop = chatContainer.scrollHeight;
      updateSyncBanner();
    }

    function appendMessage(role, content) {
      const msg = {
        role,
        content,
        timestamp: Date.now()
      };
      STATE.messages.push(msg);
      saveState();
      renderChat();
      return STATE.messages.length - 1;
    }

    function updateLastMessage(content) {
      if (STATE.messages.length === 0) return;
      STATE.messages[STATE.messages.length - 1].content = content;
      saveState();

      // Quick DOM update for smooth streaming
      const lastRow = chatContainer.querySelector('.msg-row:last-child');
      if (lastRow && lastRow.classList.contains('assistant')) {
        const bubble = lastRow.querySelector('.msg-bubble');
        if (bubble) {
          bubble.innerHTML = renderMarkdown(content) + '<span class="stream-cursor"></span>';
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }
      }
    }

    // Sync Banner Logic
    function updateSyncBanner() {
      const unsyncedCount = STATE.messages.length - (STATE.lastSyncedIndex + 1);
      if (STATE.isBunkerOnline && unsyncedCount > 0) {
        syncBanner.style.display = 'flex';
        unsyncedCountLabel.textContent = `Tienes ${unsyncedCount} mensaje(s) por sincronizar.`;
      } else {
        syncBanner.style.display = 'none';
      }
    }

    // Bunker Status Check
    async function checkBunkerStatus() {
      const base = getBunkerBaseUrl();
      try {
        const res = await fetch(`${base}/dsh-companion/status`, {
          method: 'GET',
          cache: 'no-store',
          signal: AbortSignal.timeout(2200)
        });
        if (res.ok) {
          const data = await res.json();
          if (data.status === 'online') {
            setBunkerOnline(true);
            return;
          }
        }
        setBunkerOnline(false);
      } catch (e) {
        setBunkerOnline(false);
      }
    }

    function setBunkerOnline(online) {
      STATE.isBunkerOnline = online;
      if (online) {
        statusPill.className = 'status-pill online';
        statusLabel.textContent = 'Búnker Online';
        btnHeaderDsh.style.display = 'flex';
      } else {
        statusPill.className = 'status-pill offline';
        statusLabel.textContent = 'Satélite';
        btnHeaderDsh.style.display = 'none';
      }
      updateSyncBanner();
    }

    // Sync with Bunker Endpoint
    async function syncWithBunker() {
      if (STATE.messages.length === 0) {
        showToast('No hay mensajes para sincronizar');
        return;
      }

      const base = getBunkerBaseUrl();
      const unsyncedMessages = STATE.messages.slice(STATE.lastSyncedIndex + 1);
      if (unsyncedMessages.length === 0) {
        showToast('Todos los mensajes ya fueron sincronizados');
        return;
      }

      btnHeaderSync.disabled = true;
      btnBannerSync.disabled = true;
      showToast('Sincronizando con Búnker...');

      try {
        const payload = {
          sessionTitle: `Satélite Móvil - ${new Date().toLocaleDateString('es-MX')} ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`,
          messages: STATE.messages // enviamos la sesión completa para contexto
        };

        const res = await fetch(`${base}/dsh-companion/sync`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const result = await res.json();

        if (result.ok) {
          STATE.lastSyncedIndex = STATE.messages.length - 1;
          saveState();
          updateSyncBanner();
          showToast(`¡Sincronizado! Guardado en Búnker (${result.syncedCount} mensajes).`);
        } else {
          showToast('Error en respuesta del Búnker');
        }
      } catch (err) {
        showToast(`Fallo al sincronizar: ${err.message}`);
      } finally {
        btnHeaderSync.disabled = false;
        btnBannerSync.disabled = false;
      }
    }

    // AI Streaming Requests
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || STATE.isStreaming) return;

      if (!STATE.apiKey) {
        showToast('Por favor ingresa tu API Key en Configuración');
        openSettingsModal();
        return;
      }

      userInput.value = '';
      userInput.style.height = 'auto';

      // Append user message
      appendMessage('user', text);

      // Append empty assistant message placeholder
      appendMessage('assistant', '');

      setStreaming(true);
      STATE.abortController = new AbortController();

      try {
        if (STATE.provider === 'deepseek') {
          await streamDeepSeek(STATE.abortController.signal);
        } else {
          await streamGemini(STATE.abortController.signal);
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          showToast('Generación cancelada');
        } else {
          updateLastMessage(`⚠️ Error de conexión con ${STATE.provider === 'deepseek' ? 'DeepSeek' : 'Gemini'}: ${err.message}`);
        }
      } finally {
        setStreaming(false);
        renderChat(); // Clean render without live cursor
      }
    }

    async function streamDeepSeek(signal) {
      const history = STATE.messages.slice(0, -1).map(m => ({
        role: m.role,
        content: m.content
      }));

      const payload = {
        model: STATE.model || 'deepseek-chat',
        messages: [
          ...(STATE.systemPrompt ? [{ role: 'system', content: STATE.systemPrompt }] : []),
          ...history
        ],
        stream: true
      };

      const res = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${STATE.apiKey}`
        },
        body: JSON.stringify(payload),
        signal
      });

      if (!res.ok) {
        let errMsg = `HTTP ${res.status}`;
        try {
          const errData = await res.json();
          if (errData.error && errData.error.message) errMsg = errData.error.message;
        } catch (_) {}
        throw new Error(errMsg);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let fullContent = '';
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith(':')) continue;
          if (trimmed === 'data: [DONE]') break;
          if (trimmed.startsWith('data: ')) {
            try {
              const data = JSON.parse(trimmed.slice(6));
              const delta = data.choices?.[0]?.delta?.content || '';
              if (delta) {
                fullContent += delta;
                updateLastMessage(fullContent);
              }
            } catch (_) {}
          }
        }
      }
    }

    async function streamGemini(signal) {
      const history = STATE.messages.slice(0, -1).map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.content }]
      }));

      const modelId = STATE.model || 'gemini-2.5-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:streamGenerateContent?alt=sse&key=${STATE.apiKey}`;

      const payload = {
        contents: history,
        ...(STATE.systemPrompt ? { systemInstruction: { parts: [{ text: STATE.systemPrompt }] } } : {})
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal
      });

      if (!res.ok) {
        let errMsg = `HTTP ${res.status}`;
        try {
          const errData = await res.json();
          if (errData.error && errData.error.message) errMsg = errData.error.message;
        } catch (_) {}
        throw new Error(errMsg);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let fullContent = '';
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith(':')) continue;
          if (trimmed.startsWith('data: ')) {
            try {
              const data = JSON.parse(trimmed.slice(6));
              const textPart = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
              if (textPart) {
                fullContent += textPart;
                updateLastMessage(fullContent);
              }
            } catch (_) {}
          }
        }
      }
    }

    function setStreaming(isStreaming) {
      STATE.isStreaming = isStreaming;
      btnSend.style.display = isStreaming ? 'none' : 'flex';
      btnStop.style.display = isStreaming ? 'flex' : 'none';
      userInput.disabled = isStreaming;
      if (!isStreaming) userInput.focus();
    }

    // Modal Settings Handlers
    function populateModelSelect(provider, selectedModel) {
      cfgModel.innerHTML = '';
      const list = MODELS[provider] || [];
      list.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name;
        if (m.id === selectedModel) opt.selected = true;
        cfgModel.appendChild(opt);
      });
    }

    function openSettingsModal() {
      // Sync form with STATE
      document.querySelectorAll('.provider-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.provider === STATE.provider);
      });
      populateModelSelect(STATE.provider, STATE.model);
      cfgApiKey.value = STATE.apiKey || '';
      cfgSystemPrompt.value = STATE.systemPrompt || '';
      cfgBunkerHost.value = STATE.bunkerHost || '';

      if (STATE.provider === 'deepseek') {
        apiKeyHint.innerHTML = 'Obtén tu clave en <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">DeepSeek Platform</a>.';
      } else {
        apiKeyHint.innerHTML = 'Obtén tu clave gratuita en <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>.';
      }

      modalSettings.classList.add('open');
    }

    window.openSettingsModal = openSettingsModal;

    function closeSettingsModal() {
      modalSettings.classList.remove('open');
    }

    // Event Listeners
    btnOpenConfig.addEventListener('click', openSettingsModal);
    btnCloseConfig.addEventListener('click', closeSettingsModal);
    btnCancelConfig.addEventListener('click', closeSettingsModal);

    modalSettings.addEventListener('click', (e) => {
      if (e.target === modalSettings) closeSettingsModal();
    });

    document.querySelectorAll('.provider-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.provider-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const provider = btn.dataset.provider;
        populateModelSelect(provider, provider === 'gemini' ? 'gemini-2.5-flash' : 'deepseek-chat');

        if (provider === 'deepseek') {
          apiKeyHint.innerHTML = 'Obtén tu clave en <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">DeepSeek Platform</a>.';
        } else {
          apiKeyHint.innerHTML = 'Obtén tu clave gratuita en <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>.';
        }
      });
    });

    btnToggleApiKeyEye.addEventListener('click', () => {
      cfgApiKey.type = cfgApiKey.type === 'password' ? 'text' : 'password';
    });

    btnSaveConfig.addEventListener('click', () => {
      const activeTab = document.querySelector('.provider-tab-btn.active');
      STATE.provider = activeTab ? activeTab.dataset.provider : 'gemini';
      STATE.model = cfgModel.value;
      STATE.apiKey = cfgApiKey.value.trim();
      STATE.systemPrompt = cfgSystemPrompt.value.trim();
      STATE.bunkerHost = cfgBunkerHost.value.trim();

      saveState();
      closeSettingsModal();
      renderChat();
      showToast('Configuración guardada en este dispositivo');
    });

    btnClearChat.addEventListener('click', () => {
      if (STATE.messages.length === 0) return;
      if (confirm('¿Vaciar los mensajes del chat satélite?')) {
        STATE.messages = [];
        STATE.lastSyncedIndex = -1;
        saveState();
        renderChat();
        showToast('Conversación vaciada');
      }
    });

    btnSend.addEventListener('click', sendMessage);

    btnStop.addEventListener('click', () => {
      if (STATE.abortController) {
        STATE.abortController.abort();
      }
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });

    btnHeaderSync.addEventListener('click', syncWithBunker);
    btnBannerSync.addEventListener('click', syncWithBunker);

    // Initial boot
    loadSavedState();
    renderChat();
    checkBunkerStatus();
    setInterval(checkBunkerStatus, 5000);
  </script>
</body>
</html>
